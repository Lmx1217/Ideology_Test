<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Where You Stand?</title>
    <link rel="stylesheet" href="portalstyles.css?v=4">
    <link rel="stylesheet" href="feedback.css?v=1">
    <link rel="stylesheet" href="daynight/style.css?v=4">
</head>
<body>
    <div class="container" style="font-size: 5px">
        <div class="components">
          <div class="main-button">
            <div class="moon"></div>
            <div class="moon"></div>
            <div class="moon"></div>
          </div>
          <div class="daytime-backgrond"></div>
          <div class="daytime-backgrond"></div>
          <div class="daytime-backgrond"></div>
          <div class="cloud">
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
          </div>
          <div class="cloud-light">
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
          </div>
          <div class="stars">
            <div class="star big">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star big">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star medium">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star medium">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star small">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star small">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
          </div>
        </div>
      </div>
    <div class="containerall">
        <h1 data-i18n="title" onclick="showVersion()">Where You Stand?</h1>
        <div id="options-container">
            <button class="option-button" data-i18n="startTest" onclick="startTest()">Start</button>
            <button class="option-button1" data-i18n="miniGames" onclick="games()">Mini Games</button>
            <button class="option-button1" data-i18n="notes" onclick="showNotes()">How to Get Accurate Results</button>
            <button class="option-button1" data-i18n="versionHistory" onclick="history()">Version History</button>
            <button class="option-button1" data-i18n="feedback" onclick="giveFeedback()">Feedback</button>
            <button class="option-button1" data-i18n="switchLanguage" onclick="switchLanguage()">中文 / Chinese</button>
        </div>
    </div>
    <dialog id="feedback-dialog" aria-labelledby="feedback-title">
        <h2 id="feedback-title" data-i18n="feedback">反馈问题</h2>
        <form id="feedback-form" novalidate>
            <label for="feedback-text" data-i18n="generalFeedbackLabel">你想反馈什么？</label>
            <p id="feedback-hint" data-i18n="generalFeedbackHint">可以描述遇到的问题或提出建议（最多 5000 字）。</p>
            <textarea id="feedback-text" name="feedback" rows="6" maxlength="5000" required aria-describedby="feedback-hint feedback-status"></textarea>
            <p id="feedback-status" role="status" aria-live="polite"></p>
            <div class="feedback-actions">
                <button id="feedback-cancel" class="option-button back-button" type="button" data-i18n="feedbackCancel">取消</button>
                <button id="feedback-submit" class="option-button" type="submit" data-i18n="feedbackSubmit">提交反馈</button>
            </div>
        </form>
    </dialog>
    <script src="approved-translations.js?v=26"></script>
    <script src="i18n.js?v=24"></script>
    <script src="feedback.js?v=1"></script>
    <script src="portalscript.js?v=12"></script>
    <script src="daynight/script.js"></script>
</body>
</html>
