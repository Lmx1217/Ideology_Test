<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4">Chat with Gemma2:9b</h1>
        <div id="chat-history" class="mb-4 h-64 overflow-y-auto"></div>
        <form id="chat-form" class="flex">
            <input type="text" id="prompt" class="flex-grow border rounded-l px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your message...">
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-r hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">Send</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const promptInput = document.getElementById('prompt');
        const chatHistory = document.getElementById('chat-history');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            addMessageToHistory('You', prompt);
            promptInput.value = '';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                addMessageToHistory('Gemma2:9b', data.response);
            } catch (error) {
                console.error('Error:', error);
                addMessageToHistory('Error', `Failed to get response from the model. Error: ${error.message}`);
            }
        });

        function addMessageToHistory(sender, message) {
            const messageElement = document.createElement('div');
            messageElement.className = 'mb-2';
            messageElement.innerHTML = `<strong>${sender}:</strong> ${message}`;
            chatHistory.appendChild(messageElement);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // 添加调试信息
        console.log('Script loaded. Server URL:', window.location.origin);
    </script>
</body>
</html>
