<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">意识形态测试</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="stylesheet" href="daynight/style.css">
</head>
<body>
    <div class="container" style="font-size: 5px">
        <div class="components">
          <div class="main-button">
            <div class="moon"></div>
            <div class="moon"></div>
            <div class="moon"></div>
          </div>
          <div class="daytime-backgrond"></div>
          <div class="daytime-backgrond"></div>
          <div class="daytime-backgrond"></div>
          <div class="cloud">
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
          </div>
          <div class="cloud-light">
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
          </div>
          <div class="stars">
            <div class="star big">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star big">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star medium">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star medium">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star small">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star small">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
          </div>
        </div>
      </div>
    <div class="containerall">
        <h1 data-i18n="title" onclick="showVersion()">意识形态测试</h1>
        <div id="question-container">
            <p id="question">国家应更多由政府管理还是民众管理？</p>
        </div>
        <img id="result-image" src="" alt="Result Image" style="display: none; margin-top: 20px;">
        <div id="options-container">
            <button class="option-button" onclick="selectOption('1')">政府</button>
            <button class="option-button" onclick="selectOption('2')">民众</button>
        </div>
        <div id="loading-container" style="display: none;">
            <p id="calculation-status" data-i18n="loading">计算中……</p>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
        </div>
        <button id="back-button" class="option-button back-button" data-i18n="back" style="display: none;" onclick="goBack()">后退</button>
    </div>
    <script src="approved-translations.js?v=12"></script>
    <script src="i18n.js?v=12"></script>
    <script src="script.js?v=2"></script>
    <script src="logical.js"></script>
    <script src="daynight/script.js"></script>
</body>
</html>
