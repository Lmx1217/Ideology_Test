<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">意识形态测试</title>
    <link rel="stylesheet" href="styles.css?v=4">
    <link rel="stylesheet" href="daynight/style.css">
</head>
<body>
    <div class="container" style="font-size: 5px">
        <div class="components">
          <div class="main-button">
            <div class="moon"></div>
            <div class="moon"></div>
            <div class="moon"></div>
          </div>
          <div class="daytime-backgrond"></div>
          <div class="daytime-backgrond"></div>
          <div class="daytime-backgrond"></div>
          <div class="cloud">
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
          </div>
          <div class="cloud-light">
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
            <div class="cloud-son"></div>
          </div>
          <div class="stars">
            <div class="star big">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star big">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star medium">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star medium">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star small">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
            <div class="star small">
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
              <div class="star-son"></div>
            </div>
          </div>
        </div>
      </div>
    <div class="containerall">
        <h1 data-i18n="title" onclick="showVersion()">意识形态测试</h1>
        <div id="question-container">
            <p id="question">国家应更多由政府管理还是民众管理？</p>
        </div>
        <div id="options-container">
            <button class="option-button" onclick="selectOption('1')">政府</button>
            <button class="option-button" onclick="selectOption('2')">民众</button>
        </div>
        <div id="loading-container" style="display: none;">
            <p id="calculation-status" data-i18n="loading">计算中……</p>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
        </div>
        <button id="back-button" class="option-button back-button" data-i18n="back" style="display: none;" onclick="goBack()">后退</button>
    </div>
    <dialog id="feedback-dialog" aria-labelledby="feedback-title">
        <h2 id="feedback-title" data-i18n="resultFeedback">结果不准确？</h2>
        <form id="feedback-form" novalidate>
            <label for="feedback-text" data-i18n="feedbackLabel">你觉得哪里不准确？</label>
            <p id="feedback-hint" data-i18n="feedbackHint">可以描述不符合你的观点的地方，或你认为更合适的结果（最多 5000 字）。</p>
            <textarea id="feedback-text" name="feedback" rows="6" maxlength="5000" required aria-describedby="feedback-hint feedback-status"></textarea>
            <p id="feedback-status" role="status" aria-live="polite"></p>
            <div class="feedback-actions">
                <button id="feedback-cancel" class="option-button back-button" type="button" data-i18n="feedbackCancel">取消</button>
                <button id="feedback-submit" class="option-button" type="submit" data-i18n="feedbackSubmit">提交反馈</button>
            </div>
        </form>
    </dialog>
    <script src="approved-translations.js?v=18"></script>
    <script src="i18n.js?v=19"></script>
    <script src="feedback.js?v=1"></script>
    <script src="script.js?v=4"></script>
    <script src="logical.js?v=3"></script>
    <script src="daynight/script.js"></script>
</body>
</html>
