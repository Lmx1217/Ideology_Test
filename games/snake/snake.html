<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="score">Score: <span id="score">0</span></div>
        <button id="restartButton" onclick="restartGame()">Restart</button>
        
        <div class="boundary-toggle">
            Boundaries:
            <input type="checkbox" class="checkbox" id="boundarySwitch" onclick="toggleBoundary()">
            <label class="switch" for="boundarySwitch">
                <span class="slider"></span>
            </label>
        </div>
        
        <div class="mobile-toggle">
            Mobile Mode:
            <input type="checkbox" class="checkbox" id="mobileSwitch" onclick="toggleMobileMode()">
            <label class="switch" for="mobileSwitch">
                <span class="slider"></span>
            </label>
        </div>
        
        <div id="mobileControls" class="mobile-controls" style="display: none;">
            <div class="arrow-key" id="upKey" onclick="moveSnake('UP')"></div>
            <div class="arrow-key" id="leftKey" onclick="moveSnake('LEFT')"></div>
            <div class="arrow-key" id="downKey" onclick="moveSnake('DOWN')"></div>
            <div class="arrow-key" id="rightKey" onclick="moveSnake('RIGHT')"></div>
        </div>        
    </div>
    <script src="script.js"></script>
</body>
</html>
